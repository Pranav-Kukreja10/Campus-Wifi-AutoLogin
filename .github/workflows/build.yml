name: Build & Release Campus Wi-Fi Auto-Login

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build macOS App
        run: |
          cd MacOS
          chmod +x build_macos.sh
          ./build_macos.sh
          zip -r CampusWifiLogin-macOS.zip CampusWifiLogin.app

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusWifiLogin-macOS
          path: MacOS/CampusWifiLogin-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows Executable
        run: |
          cd Windows
          .\build_nuitka.bat

      - name: Build Windows Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress
          Copy-Item Windows\CampusWifiLogin.exe Windows\Setup\CampusWifiLogin.exe
          Copy-Item LICENSE.txt Windows\Setup\LICENSE.txt
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Windows\Setup\setup.iss

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusWifiLogin-Windows-Exe
          path: Windows/CampusWifiLogin.exe

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusWifiLogin-Windows-Setup
          path: Windows/Setup/CampusWifiLogin-Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Build Linux Executable
        run: |
          cd Linux
          chmod +x build_linux.sh
          ./build_linux.sh
          tar -czvf CampusWifiLogin-Linux.tar.gz CampusWifiLogin app_icon.png install.sh uninstall.sh

      - name: Upload Linux Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusWifiLogin-Linux
          path: Linux/CampusWifiLogin-Linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
