name: Build & Release Campus Wi-Fi Auto-Login (Windows)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Windows Executable
        run: |
          cd Windows
          .\build_nuitka.bat

      - name: Build Windows Installer (Inno Setup)
        run: |
          choco install innosetup --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Windows\Setup\setup.iss

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusWifiLogin-Windows-Exe
          path: Windows/CampusWifiLogin.exe

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusWifiLogin-Windows-Setup
          path: Windows/Setup/CampusWifiLogin-Setup.exe

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
